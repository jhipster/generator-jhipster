[versions]
nativeBuildTools = '1.1.18'

[libraries]
nativeGradlePlugin = { module = 'org.graalvm.buildtools:native-gradle-plugin', version.ref = 'nativeBuildTools' }

[plugins]
# Released to the Gradle Plugin Portal on its own schedule, so it can lag behind the hibernate-core version that Spring Boot manages.
# Use the managed hibernate.version once the portal publishes it (7.4.10.Final is the latest 7.4 plugin while Spring Boot manages 7.4.13.Final).
hibernate-orm = { id = 'org.hibernate.orm', version = '7.4.10.Final' }
