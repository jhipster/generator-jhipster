[libraries]
# Applied over Spring Boot's managed versions when they are older, to pick up security fixes
jackson-bom = { module = 'tools.jackson:jackson-bom', version = '3.1.8' }
jackson-2-bom = { module = 'com.fasterxml.jackson:jackson-bom', version = '2.21.8' }
mariadb = { module = 'org.mariadb.jdbc:mariadb-java-client', version = '3.5.11' }

springdoc = { module = 'org.springdoc:springdoc-openapi-starter-webmvc-api', version = '3.2.0' }

cucumber-bom = { module = 'io.cucumber:cucumber-bom', version = '8.0.4' }

mongock-bom = { module = 'io.mongock:mongock-bom', version = '5.5.1' }

# liquibase-neo4j 5.0.4 and 5.0.4.1 fail with "Could not retrieve current Neo4j user" against the neo4j-java-driver Spring Boot manages
# TODO: drop the pin, and use Spring Boot's liquibase.version again, once a liquibase-neo4j release works with the managed driver (Liquibase 5.0.x)
liquibase-neo4j = { module = 'org.liquibase.ext:liquibase-neo4j', version = '5.0.0' }

neo4j-migrations-spring-boot-starter = { module = 'eu.michael-simons.neo4j:neo4j-migrations-spring-boot-starter', version = '4.2.0' }

# Cassandra
lz4-java = { module = 'at.yawk.lz4:lz4-java', version = '1.12.1' }

# Couchbase
couchmove = { module = 'com.github.differentway:couchmove', version = '3.4.1' }

# jib
jib-maven-plugin = { module = 'com.google.cloud.tools:jib-maven-plugin', version = '3.5.2' }
jib-spring-boot-extension-maven = { module = 'com.google.cloud.tools:jib-spring-boot-extension-maven', version = '0.1.0' }

[plugins]
gradle-git-properties = { id = 'com.gorylenko.gradle-git-properties', version = '4.0.1' }

node-gradle = { id = 'com.github.node-gradle.node', version = '7.1.0' }

gradle-liquibase = { id = 'org.liquibase.gradle', version = '3.1.1' }

gradle-sonarqube = { id = 'org.sonarqube', version = '7.5.0.8588' }

spotless-gradle-plugin = { id = 'com.diffplug.spotless', version = '8.10.4' }

gradle-modernizer-plugin = { id = 'com.github.andygoossens.gradle-modernizer-plugin', version = '1.15.0' }

gradle-develocity = { id = 'com.gradle.develocity', version = '4.6.1' }

common-custom-user-data-gradle-plugin = { id = 'com.gradle.common-custom-user-data-gradle-plugin', version = '2.8.0' }

gatling-gradle = { id = 'io.gatling.gradle', version = '3.16.0' }

gradle-openapi-generator = { id = 'org.openapi.generator', version = '7.27.0' }

gradle-jib = { id = "com.google.cloud.tools.jib", version = "3.5.4" }
